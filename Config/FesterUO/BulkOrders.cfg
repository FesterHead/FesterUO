# -----------------------------------------------------------------------------
# BulkOrders.cfg - Custom Shard Configuration for Bulk Order Master NPC Hub
# -----------------------------------------------------------------------------
# Configuration scope: BulkOrders
#
# Consumed by: custom-scripts/FesterUO/BulkOrderMaster.cs
# -----------------------------------------------------------------------------

# NPC name displayed on paperdoll and single-click.
# Default: Artisan Guildmaster
NPCName=Artisan Guildmaster

# NPC title displayed on paperdoll and overhead.
# Default: the Bulk Order Master
NPCTitle=the Bulk Order Master

# Minimum base skill required in a craft profession to claim bulk order deeds.
# Retail default: 0.1
MinSkillRequired=0.1

# Maximum interaction distance in tiles for double-click, speech, and gumps.
# Default: 4
InteractionRange=4
