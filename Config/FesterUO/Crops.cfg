###
# [Custom Shard Configuration - FesterUO]
# Origin: Custom Added (Not present in upstream ServUO)
# Scope: Crops
# Consumed By: custom-scripts/FesterUO/Crops.cs
###

# Minimum and maximum crop respawn intervals in minutes after harvest
# ServUO's FarmableCrop picked stub lingers for 5.0 minutes before deleting.
# Setting MinRespawnMinutes >= 6.0 ensures the stub disappears before a fresh crop respawns.
MinRespawnMinutes=6.0
MaxRespawnMinutes=12.0

# Probability (0.0 to 1.0) that a dirt field tile receives a crop spawner (default: 0.50 = 50%)
SpawnChance=0.50

# Facet spawn enablement
SpawnTrammel=True
SpawnFelucca=False
SpawnIlshenar=False
SpawnMalas=False
SpawnTokuno=True
SpawnTerMur=False

# Comma-separated list of farmable crop types rotated through across fields
# Standard ServUO types: FarmableCarrot, FarmableCabbage, FarmableLettuce, FarmableOnion,
# FarmablePumpkin, FarmableCotton, FarmableFlax, FarmableTurnip, FarmableWheat
CropTypes=FarmableCarrot, FarmableCabbage, FarmableLettuce, FarmableOnion, FarmablePumpkin, FarmableCotton, FarmableFlax, FarmableTurnip, FarmableWheat

