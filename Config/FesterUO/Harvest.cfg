###
# [Custom Shard Configuration - FesterUO]
# Origin: Custom Added (Not present in upstream ServUO)
# Scope: Harvest
# Consumed By: Patches (03-harvest-amount, 04-fishing-delay, 05-mining-delay, 06-lumberjacking-delay) & HarvestConfig.cs
###

# Skill-scaled harvest resource yield (Retail default: 1 ore, 10 logs)
# Scales non-linearly via power curve from 1.0x at <=50% skill up to MaxSkillYieldMultiplier at 120% skill.
# 50%=1.0x, 60%=1.2x, 70%=1.9x, 80%=3.0x, 90%=4.6x, 100%(GM)=6.6x, 110%(Elder)=9.1x, 120%(Legendary)=12.0x
SkillScalingYield=True
MaxSkillYieldMultiplier=12.0
SkillCurveExponent=2.0

# Vein consumption behavior:
# If True, bonus yield drains vein capacity faster (Mode A - speed node clearing).
# If False, vein drains at standard retail rate while granting bonus yield (Mode B - material abundance).
DrainVeinWithBonusYield=False

# Harvest action cadence and tool delays in seconds (Retail fishing: 8.0)
FishingDelay=2.0
MiningDelay=1.0
LumberjackingDelay=1.0

# Resource bank respawn times in minutes
# Retail defaults: Ore=10-20 min, Trees=20-30 min
OreMinRespawnMinutes=5.0
OreMaxRespawnMinutes=10.0
TreeMinRespawnMinutes=5.0
TreeMaxRespawnMinutes=10.0

# Resource bank capacities (vein/log pool per harvest bank)
# Retail defaults: Ore=10-34, Trees=20-45
OreMinCapacity=30
OreMaxCapacity=50
TreeMinCapacity=40
TreeMaxCapacity=60

# Sheep wool regrowth interval in minutes (Retail default: 120.0 minutes / 2 hours)
# Enforced by Fester's Skinning Knife shearing
SheepWoolRegrowthMinutes=30.0

