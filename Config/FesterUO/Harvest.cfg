# Random resource yield per successful harvest (Retail default: 1)
MinYield=3
MaxYield=6

# Harvest action cadence and tool delays in seconds (Retail fishing: 8.0)
FishingDelay=2.0
MiningDelay=1.0
LumberjackingDelay=1.0

# Resource bank respawn times in minutes
# Retail defaults: Ore=10-20 min, Trees=20-30 min
OreMinRespawnMinutes=5.0
OreMaxRespawnMinutes=10.0
TreeMinRespawnMinutes=5.0
TreeMaxRespawnMinutes=10.0

# Resource bank capacities (vein/log pool per harvest bank)
# Retail defaults: Ore=10-34, Trees=20-45
OreMinCapacity=30
OreMaxCapacity=50
TreeMinCapacity=40
TreeMaxCapacity=60
