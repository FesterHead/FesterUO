# ==============================================================================
# FesterUO High-Capacity Holding Box Configuration
# ==============================================================================

# Maximum number of items the holding box can hold (default: 1000)
HoldingBox.MaxItems=1000

# Maximum weight capacity in stones (0 = unlimited weight, default: 0)
HoldingBox.MaxWeight=0

# Default hue for freshly deployed holding boxes (1175 = Midnight Navy)
HoldingBox.DefaultHue=1175

# Gold cost to purchase a Holding Box Deed from Tinker NPC vendors (default: 100000)
Vendors.HoldingBoxDeedCost=100000
