# ==============================================================================
# FesterUO Imbuing Configuration
# ==============================================================================

# Uncap maximum property count on items (default: true)
# When enabled, items are not restricted to 5 properties during imbuing.
Imbuing.UncapPropertyCount=true

# Uncap maximum property weight on items (default: true)
# When enabled, items are not restricted to 450-500 property weight during imbuing.
Imbuing.UncapPropertyWeight=true

# Allow multiple special effects on weapons and jewels (default: true)
# When enabled, multiple hit area effects, multiple hit spells, and multiple slayers
# (both primary and secondary slayer slots) are retained rather than zeroed/replaced.
Imbuing.AllowMultipleSpecialEffects=true

# Only allow imbuing an existing property if the new value makes it higher (default: true)
# When enabled, imbuing an existing property requires the imbued value to exceed the current value,
# preventing accidental downgrades.
Imbuing.OnlyHigherExistingValues=true

# Maximum difficulty intensity used for success chance calculations (default: 450)
# Prevents success chances from mathematically collapsing to 0% as total item weight grows.
Imbuing.MaxDifficultyWeight=450

# Minimum imbuing success chance floor in percent (default: 5.0)
# Ensures skilled players always have a viable chance to imbue items with high property counts.
Imbuing.MinSuccessChance=5.0
