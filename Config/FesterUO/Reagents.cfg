###
# [Custom Shard Configuration - FesterUO]
# Origin: Custom Added (Not present in upstream ServUO)
# Scope: Reagents
# Consumed By: servuo/custom-scripts/FesterUO/WildernessReagents.cs
###

# Enable automated wilderness ground reagent spawning
Enabled=True

# Maximum number of ground reagents maintained across the wilderness (default: 500)
MaxGroundReagents=500

# Respawn check interval in minutes to replenish harvested reagents (default: 15)
RespawnIntervalMinutes=15

# Stack yield per reagent spawn on the ground (Min: 1, Max: 3)
MinSpawnAmount=1
MaxSpawnAmount=3

# Facet spawn enablement
SpawnTrammel=True
SpawnFelucca=True
