# -----------------------------------------------------------------------------
# SkillTrainer.cfg - Custom Shard Configuration for Fundamental Skill Trainer NPC
# -----------------------------------------------------------------------------
# Configuration scope: SkillTrainer
#
# Consumed by: custom-scripts/FesterUO/SkillTrainer.cs
# -----------------------------------------------------------------------------

# Target skill level to train skills up to.
# Default: 40.0
TargetSkillLevel=40.0

# Gold cost per skill trained.
# Default: 1000
GoldCost=1000

# Maximum interaction distance in tiles (for double-click, speech, and training).
# Default: 4
InteractionRange=4

# Allow drawing from player bank balance if backpack gold is insufficient.
# Default: True
AllowBankGold=True

# NPC vendor title displayed on paperdoll and single-click.
# Default: the Skill Trainer
TrainerTitle=the Skill Trainer
