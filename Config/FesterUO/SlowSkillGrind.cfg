# Scope: SlowSkillGrind
# Status: Active
###

# Master toggle for the Slow Skill Grind progression system.
# When enabled, players who reach Grandmaster (100.0) or higher can continue
# advancing their skill and skill cap past 100 without a PowerScroll through
# dedicated training over progressive cooldown intervals.
Enabled=True

# Minimum skill level required to begin the slow skill grind (Default: 100.0 GM).
MinSkillRequired=100.0

# Maximum skill cap achievable through slow grinding (Default: 120.0 Legendary).
MaxSkillCap=120.0

# --- Paced Interval Durations (in Hours per 5.0 Skill Points) ---
# Each 5.0 tier consists of 50 gains of 0.1 skill points.
# Cooldown per 0.1 gain is automatically calculated as: (TierHours * 3600 seconds) / 50.

# Tier 1 (100.0 to 105.0): 6.0 hours total (~7.2 minutes / 432 seconds per 0.1 gain).
Tier1Hours=6.0

# Tier 2 (105.0 to 110.0): 12.0 hours total (~14.4 minutes / 864 seconds per 0.1 gain).
Tier2Hours=12.0

# Tier 3 (110.0 to 115.0): 18.0 hours total (~21.6 minutes / 1296 seconds per 0.1 gain).
Tier3Hours=18.0

# Tier 4 (115.0 to 120.0): 24.0 hours total (~28.8 minutes / 1728 seconds per 0.1 gain).
Tier4Hours=24.0

# --- Notifications & Visual Feedback ---
# Send an in-game message and visual sparkle when a slow grind gain occurs.
NotifyPlayer=True
