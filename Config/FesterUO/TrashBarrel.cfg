# ==============================================================================
# FesterUO Trash Barrel & Deed Configuration
# ==============================================================================

# Enable or disable the Carpentry recipe for Trash Barrel Deeds (default: true)
TrashBarrel.CraftingEnabled=true

# Minimum Carpentry skill required to craft a Trash Barrel Deed (default: 65.0)
TrashBarrel.MinSkill=65.0

# Maximum Carpentry skill for gain progression / 100% chance (default: 90.0)
TrashBarrel.MaxSkill=90.0

# Oak boards required to craft a Trash Barrel Deed (default: 30)
TrashBarrel.OakBoards=30

# Shadow iron ingots required to craft a Trash Barrel Deed (default: 15)
TrashBarrel.ShadowIronIngots=15

# Sulfurous ash required to craft a Trash Barrel Deed (default: 5)
TrashBarrel.SulfurousAsh=5

# Whether chopping or packing up an empty trash barrel returns the deed (default: true)
TrashBarrel.ChopReturnsDeed=true
