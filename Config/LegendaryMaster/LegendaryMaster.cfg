# =====================================================================
# Legendary Master of Skills Configuration
# =====================================================================
# The Legendary Master of Skills offers combat tasks to Grandmaster (100+)
# players seeking PowerScrolls without running Champion Spawns.
# =====================================================================

# --- Quest Timers ---
# Initial time limit (in minutes) granted to complete a newly accepted task.
TaskTimeMinutes=60

# Bonus time (in minutes) added to the countdown for each confirmed target kill.
ExtraTimeMinutes=10

# --- Kill Counts & Difficulty Scaling ---
# Minimum kills rolled for a baseline task.
BaseMinKills=1

# Maximum kills rolled for a baseline task.
BaseMaxKills=3

# Additional kills added to the maximum pool for each subsequent tier (+5).
KillsPerTier=1

# --- Skill Progression Limits ---
# Minimum skill level required to request a task (Default: 100.0 GM).
MinSkillRequired=100.0

# Maximum skill cap supported by this NPC (Default: 120.0 Legendary).
MaxSkillCap=120.0

# Skill cap increase granted per completed task (Default: 5.0).
ScrollIncrement=5.0

# --- Bonus Stat Cap Scrolls ---
# Master toggle enabling or disabling bonus Stat Cap Scrolls upon task completion.
EnableStatScrolls=true

# Base chance (0.00 to 1.00) to receive a bonus Stat Cap Scroll upon completing a task.
StatScrollChance=0.01

# Chance (0.00 to 1.00) that a bonus Stat Cap Scroll rolls as high tier (+10 to +25)
# instead of standard (+5).
HighStatScrollChance=0.01

# Maximum stat cap bonus allowed from high-tier rolls (5, 10, 15, 20, or 25).
MaxStatScrollBonus=25

# --- NPC Behavior ---
# Interaction radius (in tiles) for player speech recognition.
InteractionRange=5

# Chance (0.00 to 1.00) to speak a helpful hint when non-command speech is heard nearby.
IdleBarkChance=0.15

# --- Target Creature Pool ---
# Comma-separated list of creature class names that can be assigned as hunt targets.
# Names are case-sensitive and must match valid BaseCreature mobile classes in ServUO.
Creatures=Balron, ShadowWyrm, AncientLich, AncientWyrm, SkeletalDragon, GreaterDragon, Succubus, RottingCorpse, BloodElemental, PoisonElemental, SerpentineDragon, BoneDemon, RuneBeetle, Yamandon, WhiteWyrm
