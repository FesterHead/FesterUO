###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/Accounts.cfg)
# Scope: Accounts
# Status: Customized for FesterUO Shard
###

# Number of accounts allowed to be created from a single IP address.
# In Docker, multiple LAN connections may appear from the Docker bridge gateway,
# so keeping this higher (e.g. 10 or 20) allows auto-creating multiple accounts.
AccountsPerIp=20

# If true, accounts will be automatically created on first login from the game client
AutoCreateAccounts=False

# Restrict character deletion age
RestrictDeletion=False

# Minimum age required before a character can be deleted
DeleteDelay=00:00:00
