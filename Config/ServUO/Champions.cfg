###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/Champions.cfg)
# Scope: Champions
# Status: Customized for FesterUO Shard (Duo-Scaled)
###

# Enable or disable the Champion System
Enabled=True

# Monster kills required per candle tier (Retail defaults: 256, 128, 64, 32)
# Scaled down so a 2-player co-op party can realistically complete champ spawns
Rank1MaxKills=64
Rank2MaxKills=32
Rank3MaxKills=16
Rank4MaxKills=8

# Number of Power Scrolls dropped on Champion Boss death (default: 6)
# Set to 2 so a 2-player co-op party receives 1 scroll each per champion kill
PowerScrolls=2

# Number of Stat Scrolls dropped on Harrower death (default: 16)
# Set to 2 so a 2-player co-op party receives 1 stat scroll each per Harrower kill
StatScrolls=2

# Chance to drop Scrolls of Transcendence (default: 50.0%)
TranscendenceChance=50.0
