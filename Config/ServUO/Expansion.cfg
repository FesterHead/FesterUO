###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/Expansion.cfg)
# Scope: Expansion
# Status: Customized for FesterUO Shard
###

# The active expansion for the shard.
# Valid options:
#   None, T2A, UOR, UOTD, LBR, AOS, SE, ML, SA, HS, TOL, EJ
#
# Setting TOL (Time of Legends) locks the expansion level to Time of Legends.
CurrentExpansion=TOL

# Minimum arcanists required to cast Arcane Circle (Retail default: 2)
# Set to 1 so solo spellweavers can cast, or 2 for duo
ArcaneCircleMinWeavers=1

# Grants maximum Arcane Focus strength bonus (5, or 6 at Sanctuary) when 2 or more arcanists cast together
ArcaneCircleDuoMaxFocus=True
