###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/General.cfg)
# Scope: General
# Status: Customized for FesterUO Shard
###

# Restrict red (murderer) players to Felucca (default: False)
RestrictRedsToFel=False

# Default ground item decay time in minutes (default: 60)
DefaultItemDecayTime=60

# Show staff members as offline in page queue (default: True)
ShowStaffOffline=True

# Multiplier applied to Peerless and boss key lifespans (Retail default: 1.0)
# Scaled to 3.0x (e.g. 10m -> 30m, 30m -> 90m, 1h -> 3h) for a relaxed 2-player dungeon pace
PeerlessKeyLifespanScale=3.0
