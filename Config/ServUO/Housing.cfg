###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/Housing.cfg)
# Scope: Housing
# Status: Customized for FesterUO Shard
###

# Maximum houses allowed per account (default: 1)
AccountHouseLimit=1

# Whether houses and boats decay when unrefreshed (default: True)
# Disabled on FesterUO to protect player homes and ships from collapsing during breaks
DecayEnabled=False

# Maximum deployed (active) ships allowed per character (0 = unlimited).
# Setting to 0 disables the High Seas 1-deployed-ship limit, allowing players to place
# multiple ships without having to dry-dock their active vessels.
# Default retail High Seas behavior is 1.
MaxDeployedShips=0
