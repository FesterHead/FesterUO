###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/PlayerCaps.cfg)
# Scope: PlayerCaps
# Status: Customized for FesterUO Shard (Stat/Skill caps, anti-macro, stat gain cadence)
###

# Total Stat Cap: Maximum combined total of Strength + Dexterity + Intelligence.
# Default is 225. Set to 450 to allow three 150-point maxed stats.
TotalStatCap=450

# Total Skill Cap in tenths of a percent (e.g., 7000 = 700.0%).
# Default is 7000 (7 GM skills at 100.0).
#   7000  = 700.0%  (7 GM skills at 100.0)
#   10000 = 1000.0% (10 GM skills at 100.0)
#   12000 = 1200.0% (10 Legendary skills at 120.0 with Power Scrolls)
TotalSkillCap=12000

# Base Individual Stat Caps: Natural maximum achievable through normal training.
# Default is 125.
StrCap=125
DexCap=125
IntCap=125

# Maximum Stat Caps (with Stat Scrolls):
# Stat Scrolls (e.g., +5 to +25 from Harrower/Champion Spawns) increase the individual stat
# caps beyond the base cap (125) up to this maximum ceiling.
# Setting to 150 allows players using +25 stat scrolls to reach 150 in each stat (150 x 3 = 450 total).
StrMaxCap=150
DexMaxCap=150
IntMaxCap=150

# Base Individual Skill Cap in tenths of a percent (1000 = 100.0%).
# - At 1000 (Default): All skills start capped at 100.0% (Grandmaster).
#   Players MUST use Power Scrolls (105, 110, 115, 120 from Champion Spawns) to increase individual
#   skill caps from 100.0 up to 120.0% (Legendary).
# - At 1200: All skills start with a natural cap of 120.0% on character creation,
#   bypassing the need for Power Scrolls completely.
SkillCap=1000

# Anti-macro restrictions for skill and stat gains (default: False)
# When True, players can only gain 3 times from the same 4x4 tile/target within 5 minutes.
EnableAntiMacro=True

# Time delay between stat gains (default: False)
# When True, enforces the cooldown specified by PlayerStatTimeDelay.
EnablePlayerStatTimeDelay=True

# Time delay between player stat gains (Format: dd:hh:mm:ss)
# 00:00:05:00 (5 minutes) = ~35-50 hours of active play to hit 450 stat cap (protects longevity for high-frequency play)
PlayerStatTimeDelay=00:00:05:00

# The percentage chance for a player to gain in a stat on a valid skill check (Default: 5.0)
PlayerChanceToGainStats=5.0

# Time delay between pet stat gains
EnablePetStatTimeDelay=True
PetStatTimeDelay=00:00:05:00
PetChanceToGainStats=5.0


