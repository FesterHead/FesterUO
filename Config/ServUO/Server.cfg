###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/Server.cfg)
# Scope: Server
# Status: Customized for FesterUO Shard (LAN routing & Shard name)
###

# The displayed name of the shard
Name=FesterUO

# The internal IP address to listen on.
# In Docker, 0.0.0.0 binds to all container interfaces.
# Default: 0.0.0.0
Listen=0.0.0.0

# The public IP address or domain to broadcast in the server list packet.
# Set this to your Docker host's LAN IP (192.168.86.48) so LAN clients can connect.
Address=192.168.86.48

# If your server is running in an environment where the process sees a different
# IP Address than the IP address your LAN clients should connect to (such as
# Docker default bridge network), specify the address that LAN clients will connect to.
# This should be the Docker host's LAN IP (e.g., 192.168.86.x) so clients don't get
# stuck at "Logging into Shard". (Added in ServUO PR #5047)
PrivateAddress=192.168.86.48

# The Port to bind the Listener to.
# Default: 2593
Port=2593
