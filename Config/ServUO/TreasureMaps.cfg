###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (upstream/Config/TreasureMaps.cfg)
# Scope: TreasureMaps
# Status: Customized for FesterUO Shard (Accelerated 7-day reset)
###

# Enable or disable the modern treasure map chest system
Enabled=True

# Time in days before dug treasure chest locations reset (default: 30.0)
# Lowered to 7 days for more frequent treasure hunting
ResetTime=7.0

# Allow any character to view, use, and dig decoded treasure maps without decoder or Cartography skill restrictions (default: True)
DecodedMapsOpenToAll=True

# Gold cost per level when upgrading a treasure map (default: 10000)
UpgradeCostPerLevel=10000

# Maximum upgrade level for treasure maps (default: 6, keeping Level 7 Diabolical natural-only)
MaxUpgradeLevel=6

# Gold cost per level when upgrading an SOS message (default: 10000)
SOSUpgradeCostPerLevel=10000

# Maximum upgrade level for SOS messages (default: 3, keeping Level 4 Ancient natural-only)
SOSMaxUpgradeLevel=3

# Maximum Cartography skill gainable from crafting World Maps (default: 100.0, retail/classic: 99.5)
# Setting this to 100.0 enables reaching Grandmaster Cartography by crafting World Maps
# without being forced to decode high-level treasure maps.
WorldMapMaxSkill=100.0

# Enable enhanced loot quality budget tables for Treasure Map and SOS equipment (default: True)
# Shifts the budget distribution curve to significantly reduce low-tier/junk equipment rolls
# and increase high/artifact-tier reforged equipment chances.
EnhancedLootQuality=True

# Additional flat bonus added to minimum and maximum loot budget when EnhancedLootQuality is enabled (default: 100)
LootBudgetBonus=100

# Apply player Luck and Felucca rules when rolling equipment stats in chests (default: True)
# When True, the digger/fisher's real Luck and Felucca budget bonus are passed into Runic Reforging.
ApplyPlayerLuck=True

# Multiplier applied to magical equipment drop counts in SOS/MIB chests (default: 2.0)
# Default 2.0 doubles SOS equipment drops (e.g., L3: 30-40 items, L4 Ancient: 40-50 items).
SOSItemCountMultiplier=2.0
