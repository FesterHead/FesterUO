###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (upstream/Config/TreasureMaps.cfg)
# Scope: TreasureMaps
# Status: Customized for FesterUO Shard (Accelerated 7-day reset)
###

# Enable or disable the modern treasure map chest system
Enabled=True

# Time in days before dug treasure chest locations reset (default: 30.0)
# Lowered to 7 days for more frequent treasure hunting
ResetTime=7.0

# Allow any character to view, use, and dig decoded treasure maps without decoder or Cartography skill restrictions (default: True)
DecodedMapsOpenToAll=True

# Gold cost per level when upgrading a treasure map (default: 10000)
UpgradeCostPerLevel=10000

# Maximum upgrade level for treasure maps (default: 6, keeping Level 7 Diabolical natural-only)
MaxUpgradeLevel=6

# Gold cost per level when upgrading an SOS message (default: 10000)
SOSUpgradeCostPerLevel=10000

# Maximum upgrade level for SOS messages (default: 3, keeping Level 4 Ancient natural-only)
SOSMaxUpgradeLevel=3

