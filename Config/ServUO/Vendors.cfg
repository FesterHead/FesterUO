###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/Vendors.cfg)
# Scope: Vendors
# Status: Customized for FesterUO Shard (Restock timer & Powder of Fortifying)
###

# Restock delay in minutes for NPC vendors (default: 60)
# Lowered to 15 minutes for a smooth 2-player experience
RestockDelay=15

# Initial stock quantity for trade goods like ingots, cloth, and arrows (default: 500)
EconomyStockAmount=1000

# Stock quantity for all reagents sold by NPC vendors (default: 1000)
ReagentStockAmount=1000

# Powder of Fortifying (Powder of Temperament) sold by Blacksmiths and Tinkers
PowderOfTemperamentCost=10000
PowderOfTemperamentCharges=10

# Bulk Order Deed refresh delay in hours (Retail default: 6)
# Lowered to 1 hour for a smooth 2-player crafting experience
BODDelayHours=1
