###
# [Base ServUO Platform Configuration]
# Origin: ServUO Core (servuo/upstream/Config/VetRewards.cfg)
# Scope: VetRewards
# Status: Customized for FesterUO Shard (30-day tiers, strict skill cap)
###

# Enable or disable the Veteran Rewards system
Enabled=True

# Time interval required to earn each reward tier (format: d.hh:mm:ss)
# Default is 30 days (retail OSI is 365 days)
RewardInterval=30.00:00:00

# Starting reward tier granted to brand-new accounts (default: 0)
# Set higher (e.g., 5 or 10) if you want players to immediately claim rewards
StartingLevel=0

# Enable bonus skill cap based on account age (default: True)
# Set to False and SkillCapBonus=0 to enforce the hard skill cap in PlayerCaps.cfg (1200.0%)
SkillCapRewards=False

# Total bonus skill cap in tenths of a percent (0 = no extra bonus points)
SkillCapBonus=0

# Number of reward tiers to distribute the skill cap bonus across (default: 4)
SkillCapBonusLevels=4
